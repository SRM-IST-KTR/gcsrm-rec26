<!DOCTYPE html>
<html>
<head><style>
  body { display: flex; flex-wrap: wrap; }
  div { margin: 10px; text-align: center; font-family: monospace; }
  img { width: 150px; height: 150px; object-fit: contain; border: 1px solid black; }
</style></head>
<body>
<script>
  fetch('/assets_list.txt').then(r => r.text()).then(t => {
    t.split('\n').filter(Boolean).forEach(f => {
      document.body.innerHTML += `<div><img src="/assets/${f}"><br>${f}</div>`;
    });
  });
</script>
</body>
</html>
